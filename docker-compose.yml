# WASPADAIN — stack produksi (PostgreSQL + Next.js)
#
#   cp .env.docker.example .env.docker
#   # isi AUTH_SECRET, POSTGRES_PASSWORD, APP_URL (Resend opsional)
#   docker compose --env-file .env.docker up -d --build
#
# Compose TIDAK membaca .env.docker secara otomatis. Selalu sertakan
# --env-file .env.docker pada setiap perintah compose. Port host default
# memakai rentang 7000-9999 yang jarang dipakai (lihat .env.docker.example).
name: waspadain

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waspadain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-waspadain}
      # Menghindari error "could not resize shared memory" saat query berat.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: ${TZ:-Asia/Jakarta}
    # Loopback only: database tidak pernah terbuka ke jaringan publik.
    # DB_PORT adalah port host (default 7482), bukan port internal Postgres.
    ports:
      - "127.0.0.1:${DB_PORT:-7482}:5432"
    volumes:
      - waspadain_pgdata:/var/lib/postgresql/data
    shm_size: "256mb"
    healthcheck:
      # $$ membuat compose menunda interpolasi ke shell di dalam container,
      # sehingga nilainya selalu sama dengan environment container.
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Disusun dari POSTGRES_* agar satu sumber kebenaran. Untuk database
      # eksternal, timpa lewat docker-compose.override.yml (lihat README).
      DATABASE_URL: postgresql://${POSTGRES_USER:-waspadain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-waspadain}?schema=public
      # Tanpa fallback publik: compose menolak start tanpa secret asli.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET wajib diisi dengan nilai acak minimal 32 karakter}
      APP_URL: ${APP_URL:-http://localhost:7481}
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      # Opsional. Biarkan kosong bila email reset password tidak dipakai.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    ports:
      # Port internal Next.js selalu 3000. APP_HOST bisa diarahkan ke
      # 127.0.0.1 bila aplikasi berada di belakang reverse proxy.
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-7481}:3000"
    # Backup JSON dari reset akun disimpan di volume agar tidak hilang saat
    # container diganti. Salin dengan `docker compose cp app:/app/backups ./`.
    volumes:
      - waspadain_backups:/app/backups
    # Aplikasi tidak butuh capability tambahan dan tidak berjalan as root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrasi + seed katalog saat boot pertama bisa memakan waktu.
      start_period: 90s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  waspadain_pgdata:
  waspadain_backups:
